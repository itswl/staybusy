# Set this to your own registry before installing.
image:
  repository: ghcr.io/you/staybusy
  # Empty means the chart's appVersion (a released tag). Do not use "latest"
  # with IfNotPresent: nodes that already cached it will never pull a new one.
  tag: ""
  pullPolicy: IfNotPresent

# staybusy arguments. Keep the image default (["-cpu","25"]) by leaving this empty.
args: ["-cpu", "25"]

# Extra STAYBUSY_* environment variables, e.g.:
#   env:
#     - name: STAYBUSY_NET_DOWN
#       value: "20"
env: []

# Run one instance per node to load the whole cluster.
daemonSet: false
replicaCount: 1

resources:
  limits:
    memory: 64Mi

# Writable scratch space for the disk dimension and -report; bounded so a
# runaway disk file cannot fill the node. Raise it for larger -disk-size.
tmp:
  sizeLimit: 1Gi

# Expose /metrics, /healthz and the load endpoint. This requires -serve in args
# (the chart refuses to render otherwise), and warning: the control plane is
# unauthenticated, so restrict who can reach it.
service:
  enabled: false
  port: 8080
  metricsAnnotations: false

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
