{{- if and .Values.service.enabled (not (has "-serve" .Values.args)) }}
{{- fail "service.enabled needs -serve in args (e.g. args: [\"-serve\", \":8080\"]), or the readiness probe will never pass" }}
{{- end }}
{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: staybusy
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if .Values.service.metricsAnnotations }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.service.port | quote }}
    prometheus.io/path: /metrics
  {{- end }}
spec:
  selector:
    app.kubernetes.io/name: staybusy
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- end }}
