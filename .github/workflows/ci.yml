name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not formatted:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build
        run: CGO_ENABLED=0 go build -o staybusy .

      # A smoke test worth having: every flag the binary exposes should appear in
      # the README, and every flag the README mentions should exist. Both halves
      # have drifted before.
      - name: flags match the docs
        run: |
          fail=0
          for f in $(./staybusy 2>&1 | grep -oE '^  -[a-z-]+' | tr -d ' '); do
            grep -q -- "\`$f\`" README.md || { echo "undocumented: $f"; fail=1; }
          done
          for f in $(grep -oE '`-[a-z-]+`' README.md | tr -d '`' | sort -u); do
            ./staybusy 2>&1 | grep -qE "^  $f( |$)" || { echo "documented but absent: $f"; fail=1; }
          done
          exit $fail

      - name: it actually loads a cpu
        run: |
          ./staybusy -cpu 40 & pid=$!
          sleep 3
          a=$(awk '{print $14+$15}' /proc/$pid/stat); sleep 5
          b=$(awk '{print $14+$15}' /proc/$pid/stat); kill $pid
          pct=$(echo "$a $b" | awk '{printf "%.0f", ($2-$1)/100/5*100/'"$(nproc)"'}')
          echo "measured ${pct}% of the machine, asked for 40%"
          [ "$pct" -ge 25 ] && [ "$pct" -le 55 ]
