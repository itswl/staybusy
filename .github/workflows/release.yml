name: release

# Tag a commit to cut a release:  git tag v0.5.0 && git push origin v0.5.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write  # create the GitHub release
  packages: write  # push to ghcr

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: build binaries
        run: |
          v=${GITHUB_REF_NAME}
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags="-s -w" -o "dist/staybusy-$os-$arch" .
          done
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ${{ github.repository }} is owner/repo, so the image path follows the
      # repo wherever it lives - nothing to edit if it moves or is forked.
      - name: build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
